[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-connectivity-test-framework"
version = "0.1.0"
description = "Android Bluetooth and Wi-Fi connectivity test framework"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
bluetooth = ["bleak>=0.22"]

[project.scripts]
wearable-test = "wearables.cli:main"
wearable-ui = "wearables.web:main"
connectivity-desktop = "wearables.tk_ui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]